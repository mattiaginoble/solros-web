# Pubblica la versione statica dell'app (dati nel browser) su GitHub Pages.
# Richiede una volta: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: GitHub Pages

on:
  push:
    branches: [feature/configuratore-casa, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Static build
        run: npm run build:static
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_FULL_APP_URL: https://solros-web.vercel.app
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    # Solo dal branch predefinito (quello ammesso dall'ambiente github-pages).
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
