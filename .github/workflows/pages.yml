# Pubblica la versione statica dell'app (dati nel browser) su GitHub Pages.
# Richiede una volta: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: GitHub Pages

on:
  push:
    branches: [feature/configuratore-casa, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Placeholder page (la versione statica non è più pubblicata)
        run: |
          mkdir -p out
          printf '%s\n' '<!doctype html><html lang="it"><meta charset="utf-8"><meta name="robots" content="noindex"><title>Non disponibile</title><p>Questo sito non è più pubblicato.</p></html>' > out/index.html
          cp out/index.html out/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    # Solo dal branch predefinito (quello ammesso dall'ambiente github-pages).
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
